# Production: PostgreSQL, the Spring Boot API and Nginx (the built React app), behind the host's
# HTTPS reverse proxy. Settings and secrets come from .env (copy .env.example). Use the
# `make prod-*` commands, and see docs/DEPLOYMENT.md. For development, use compose.yaml instead.
name: vt-booking-prod

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No ports: only the API reaches the database.

  backend:
    # Pulled from GHCR (built by .github/workflows/images.yml), or built locally with `make prod-update`.
    image: ghcr.io/fribyte-code/vt-booking-backend:${IMAGE_TAG:-latest}
    build: backend
    environment:
      # No SPRING_PROFILES_ACTIVE: the dev profile must never run in production.
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_USER: booking
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/auth/csrf"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    # No ports: only Nginx reaches the API. Never publish 8080 (see docs/DEPLOYMENT.md).

  frontend:
    image: ghcr.io/fribyte-code/vt-booking-frontend:${IMAGE_TAG:-latest}
    build: frontend
    environment:
      # The reverse proxy in front of Nginx, as Nginx sees it, and the header with the client address.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1}
      REAL_IP_HEADER: ${REAL_IP_HEADER:-X-Forwarded-For}
    volumes:
      - ./frontend/real-ip.conf.template:/etc/nginx/templates/real-ip.conf.template:ro
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
