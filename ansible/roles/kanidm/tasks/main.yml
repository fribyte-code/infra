---
- name: Install common packages
  ansible.builtin.apt:
    pkg:
      - nginx
      - nginx-module-acme
    state: present
  become: true

- name: Write kanidm container file
  ansible.builtin.template:
    src: templates/kanidm.container
    dest: /etc/containers/systemd/
    mode: "0644"
  notify:
    - Reload Systemd
    - Restart kanidm
  become: true

- name: Write kanidm config file
  ansible.builtin.template:
    src: templates/server.toml
    dest: /var/lib/kanidm/
    mode: "0644"
  notify: Restart kanidm
  become: true

- name: Write kanidm nginx config
  ansible.builtin.template:
    src: templates/nginx.conf
    dest: /etc/nginx/
    mode: "0644"
    validate: /usr/sbin/nginx -t -c %s
  notify: Restart nginx
  become: true
