---
- name: Ensure prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
      - ubuntu-keyring
    state: present
    update_cache: true
  become: true

- name: Download nginx signing key
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /tmp/nginx_signing.key
    mode: '0644'
  become: true

- name: Convert nginx signing key to keyring (dearmor)
  ansible.builtin.command:
    cmd: >
      gpg --batch --yes --dearmor
      -o {{ nginx_keyring_path }}
      /tmp/nginx_signing.key
  args:
    creates: "{{ nginx_keyring_path }}"
  register: nginx_dearmor_result
  become: true

- name: Configure nginx.org apt repository (stable or mainline)
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ nginx_keyring_path }}]
      https://nginx.org/packages{% if nginx_repo_branch == 'mainline' %}/mainline{% endif %}/ubuntu
      {{ ansible_lsb.codename | default(ansible_distribution_release) }}
      nginx
    filename: nginx
    state: present
  become: true

- name: Set up repository pinning to prioritize nginx.org packages
  ansible.builtin.copy:
    dest: "/etc/apt/preferences.d/99nginx"
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: *
      Pin: origin nginx.org
      Pin: release o=nginx
      Pin-Priority: 900
  become: true

- name: Install nginx and ACME module
  ansible.builtin.apt:
    name:
      - nginx
      - nginx-module-acme
    state: present
    update_cache: true
  become: true
